<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <filter id="fibre">
    <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="23" stitchTiles="stitch"/>
    <feColorMatrix values="0.16 0 0 0 0.68 0 0.14 0 0 0.62 0 0 0.12 0 0.54 0 0 0 0.14 0"/>
  </filter>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="2" seed="29" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.42 0 0 0 0 0.36 0 0 0 0 0.3 0 0 0 0.018 0"/>
  </filter>
  <rect width="360" height="360" filter="url(#fibre)"/>
  <rect width="360" height="360" filter="url(#grain)"/>
</svg>
